# Конфиг сайта qwen
# Содержит: url, home/reset, scenarios, prompts

site:
  name: qwen
  url: https://chat.qwen.ai/

  home:
    reset:
      sequence:
        - type: hotkey
          keys: [ctrl, l]
        - type: wait
          seconds: 2.0
        - type: text
          value: https://chat.qwen.ai/
        - type: key
          key: enter
        - type: wait
          seconds: 3.0

  scenarios:
    web_search_no_think:
      start_state: start_question

      states:
        start_question:
          expect:
            templates:
              - templates/chromium/qwen/plus_in_the_circle.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/qwen/more.png
            threshold: 0.8
          next:
            success: empty_start
            fail: start_question
          timeout: 120.0

        empty_start:
          expect:
            templates:
              - templates/chromium/qwen/more.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/qwen/web_search.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 120.0

        options_menu_opened:
          expect:
            templates:
              - templates/chromium/qwen/web_search.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/qwen/web_search_selected.png
            threshold: 0.8
          next:
            success: ask_empty
            fail: start_question
          timeout: 120.0

        ask_empty:
          expect:
            templates:
              - templates/chromium/qwen/how_can.png
            threshold: 0.8
          action: click_paste_enter
          condition:
            templates:
              - templates/chromium/qwen/stop.png
            threshold: 0.8
          next:
            success: answer_processing
            fail: start_question
          timeout: 120.0

        answer_processing:
          expect:
            templates:
              - templates/chromium/qwen/white_gray_arrow_up.png
            threshold: 0.8
          action: mousemove
          condition:
            templates:
              - templates/chromium/qwen/regenerate.png
            threshold: 0.8
          next:
            success: end_of_answer
            fail: page_end
          timeout: 300.0

        page_end:
          expect:
            templates:
              - templates/chromium/qwen/vertical_line.png
            threshold: 0.7
          action: click_ctrl_end
          condition:
            templates:
              - templates/chromium/qwen/regenerate.png
            threshold: 0.7
          next:
            success: end_of_answer
            fail: black_arrow_down
          timeout: 60.0

        black_arrow_down:
          expect:
            templates:
              - templates/chromium/qwen/black_arrow_down.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/qwen/regenerate.png
            threshold: 0.7
          next:
            success: end_of_answer
            fail: start_question
          timeout: 60.0

        end_of_answer:
          expect:
            templates:
              - templates/chromium/qwen/copy.png
            threshold: 0.8
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: click_like
            fail: click_dislike
          timeout: 120.0

        click_like:
          expect:
            templates:
              - templates/chromium/qwen/like.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/qwen/regenerate.png
            threshold: 0.7
          next:
            success: start_question
            fail: start_question
          timeout: 120.0

        click_dislike:
          expect:
            templates:
              - templates/chromium/qwen/dislike.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/qwen/regenerate.png
            threshold: 0.7
          next:
            success: ask_json
            fail: start_question
          timeout: 120.0

        ask_json:
          expect:
            templates:
              - templates/chromium/qwen/how_can.png
            threshold: 0.7
          action: click_paste_file_enter
          file: prompts/qwen/ask_json
          condition:
            templates:
              - templates/chromium/qwen/stop.png
            threshold: 0.7
          next:
            success: answer_processing
            fail: start_question
          timeout: 120.0


prompts:
  qwen:
    hypos_norm:
      gen:
        text: prompts/qwen/hypos_norm/gen/hn_gen_qwen_text_latest
        json: prompts/qwen/hypos_norm/gen/hn_gen_qwen_json_latest
      filter:
        text: prompts/qwen/hypos_norm/filter/hn_filter_qwen_text_latest
        json: prompts/qwen/hypos_norm/filter/hn_filter_qwen_json_latest
