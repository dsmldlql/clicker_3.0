# Конфиг сайта gemini
# Содержит: url, home/reset, scenarios, prompts

site:
  name: gemini
  url: https://gemini.google.com/

  home:
    reset:
      sequence:
        - type: hotkey
          keys: [ctrl, l]
        - type: wait
          seconds: 2.0
        - type: text
          value: https://gemini.google.com/
        - type: key
          key: enter
        - type: wait
          seconds: 5.0

  scenarios:
    thinking_0:
      start_state: start_question

      states:
        start_question:
          expect:
            templates:
              - templates/chromium/gemini/main_page_thinking_0.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/ask_gemini_0.png
            threshold: 0.7
          next:
            success: ask_empty
            fail: if_pro
          timeout: 120.0

        if_pro:
          expect:
            templates:
              - templates/chromium/gemini/main_page_pro_0.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/option_thinking_0.png
            threshold: 0.7
          next:
            success: options_menu_opened
            fail: if_fast
          timeout: 5.0

        if_fast:
          expect:
            templates:
              - templates/chromium/gemini/main_page_fast_0.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/option_thinking_0.png
            threshold: 0.7
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 5.0

        options_menu_opened:
          expect:
            templates:
              - templates/chromium/gemini/option_thinking_0.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/main_page_thinking_0.png
            threshold: 0.7
          next:
            success: ask_empty
            fail: start_question
          timeout: 10.0

        ask_empty:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini_0.png
            threshold: 0.7
          action: click_paste_enter
          condition:
            templates:
              - templates/chromium/gemini/stop_0.png
            threshold: 0.7
          next:
            success: answer_processing
            fail: check_black_arrow
          timeout: 20.0

        check_black_arrow:
          expect:
            templates:
              - templates/chromium/gemini/black_arrow.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/black_arrow.png
            threshold: 0.7
          next:
            success: start_question
            fail: check_stop
          timeout: 10.0

        check_stop:
          expect:
            templates:
              - templates/chromium/gemini/stop_0.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          next:
            success: answer_processing
            fail: answer_processing
          timeout: 10.0

        answer_processing:
          expect:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.6
          next:
            success: page_end
            fail: start_question
          timeout: 200.0

        page_end:
          click_center: [300, 300]
          click_radius: [40, 30]
          action: click_ctrl_end
          condition:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          next:
            success: end_of_answer
            fail: start_question
          timeout: 20.0

        end_of_answer:
          expect:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.7
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: click_like
            fail: click_dislike
          timeout: 120.0

        click_like:
          expect:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          next:
            success: start_question
            fail: start_question
          timeout: 120.0

        click_dislike:
          expect:
            templates:
              - templates/chromium/gemini/dislike.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          next:
            success: close_dislike_options
            fail: start_question
          timeout: 120.0

        close_dislike_options:
          expect:
            templates:
              - templates/chromium/gemini/dislike_close_space.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/ask_gemini_after_dislike.png
            threshold: 0.7
          next:
            success: ask_json
            fail: start_question
          timeout: 120.0

        ask_json:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini_0.png
            threshold: 0.7
          action: click_paste_file_enter
          file: prompts/gemini/ask_json
          condition:
            templates:
              - templates/chromium/gemini/stop_0.png
            threshold: 0.7
          next:
            success: answer_processing_1
            fail: start_question
          timeout: 120.0

        answer_processing_1:
          expect:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.6
          next:
            success: page_end_1
            fail: start_question
          timeout: 200.0

        page_end_1:
          click_center: [300, 300]
          click_radius: [40, 30]
          action: click_ctrl_end
          condition:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          next:
            success: end_of_answer_1
            fail: start_question
          timeout: 20.0

        end_of_answer_1:
          expect:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.7
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: click_like_1
            fail: click_dislike_1
          timeout: 120.0

        click_like_1:
          expect:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          next:
            success: start_question
            fail: start_question
          timeout: 120.0

        click_dislike_1:
          expect:
            templates:
              - templates/chromium/gemini/dislike.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_0.png
            threshold: 0.7
          next:
            success: start_question
            fail: start_question
          timeout: 120.0

    thinking_1:
      start_state: start_question

      states:
        start_question:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini_start_1.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/main_page_thinking_1.png
            threshold: 0.7
          next:
            success: ask_empty
            fail: if_pro
          timeout: 120.0

        if_pro:
          expect:
            templates:
              - templates/chromium/gemini/main_page_pro_1.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/thinking_option_1.png
            threshold: 0.7
          next:
            success: options_menu_opened
            fail: if_fast
          timeout: 20.0

        if_fast:
          expect:
            templates:
              - templates/chromium/gemini/main_page_fast_1.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/thinking_option_1.png
            threshold: 0.7
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 20.0

        options_menu_opened:
          expect:
            templates:
              - templates/chromium/gemini/thinking_option_1.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/main_page_thinking_1.png
            threshold: 0.7
          next:
            success: ask_empty
            fail: start_question
          timeout: 120.0

        ask_empty:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini_1.png
            threshold: 0.7
          action: click_paste_enter
          condition:
            templates:
              - templates/chromium/gemini/stop_1.png
            threshold: 0.7
          next:
            success: answer_processing
            fail: answer_processing
          timeout: 120.0

        answer_processing:
          expect:
            templates:
              - templates/chromium/gemini/voice_mode_1.png
            threshold: 0.7
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.7
          next:
            success: find_copy_button
            fail: start_question
          timeout: 200.0

        find_copy_button:
          expect:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.7
          next:
            success: end_of_answer
            fail: start_question
          timeout: 120.0

        end_of_answer:
          expect:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.7
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: find_like_button
            fail: find_dislike_button
          timeout: 120.0

        find_like_button:
          expect:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          next:
            success: click_like
            fail: start_question
          timeout: 120.0

        click_like:
          expect:
            templates:
              - templates/chromium/gemini/like.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_1.png
            threshold: 0.7
          next:
            success: start_question
            fail: start_question
          timeout: 120.0

        find_dislike_button:
          expect:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/dislike.png
            threshold: 0.7
          next:
            success: click_dislike
            fail: start_question
          timeout: 120.0

        click_dislike:
          expect:
            templates:
              - templates/chromium/gemini/dislike.png
            threshold: 0.7
          action: click
          condition:
            templates:
              - templates/chromium/gemini/voice_mode_1.png
            threshold: 0.7
          next:
            success: ask_json
            fail: start_question
          timeout: 120.0

        ask_json:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini_1.png
            threshold: 0.7
          action: click_paste_file_enter
          file: prompts/gemini/ask_json
          condition:
            templates:
              - templates/chromium/gemini/stop_1.png
            threshold: 0.7
          next:
            success: answer_processing
            fail: start_question
          timeout: 120.0

    pro:
      start_state: start_question

      states:
        start_question:
          expect:
            templates:
              - templates/chromium/gemini/main_page_pro.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/gemini/pro.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: if_thinking
          timeout: 120.0

        if_thinking:
          expect:
            templates:
              - templates/chromium/gemini/main_page_thinking.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/gemini/pro.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: if_fast
          timeout: 120.0

        if_fast:
          expect:
            templates:
              - templates/chromium/gemini/main_page_fast.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/gemini/pro.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 120.0

        options_menu_opened:
          expect:
            templates:
              - templates/chromium/gemini/pro.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/gemini/main_page_pro.png
            threshold: 0.8
          next:
            success: ask_empty
            fail: start_question
          timeout: 120.0

        ask_empty:
          expect:
            templates:
              - templates/chromium/gemini/ask_gemini.png
            threshold: 0.8
          action: click_paste_enter
          condition:
            templates:
              - templates/chromium/gemini/stop.png
            threshold: 0.9
          next:
            success: answer_processing
            fail: answer_processing
          timeout: 120.0

        answer_processing:
          expect:
            templates:
              - templates/chromium/gemini/voice_mode.png
            threshold: 0.8
          action: mousemove
          condition:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.8
          next:
            success: find_copy_button
            fail: start_question
          timeout: 300.0

        find_copy_button:
          expect:
            templates:
              - templates/chromium/gemini/more.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.8
          next:
            success: end_of_answer
            fail: start_question
          timeout: 120.0

        end_of_answer:
          expect:
            templates:
              - templates/chromium/gemini/copy.png
            threshold: 0.8
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: start_question
            fail: start_question
          timeout: 120.0


prompts:
  gemini:
    hypos_norm:
      gen:
        text: prompts/gemini/hypos_norm/gen/hn_gen_gemini_text_latest
        json: prompts/gemini/hypos_norm/gen/hn_gen_gemini_json_latest
      filter:
        text: prompts/gemini/hypos_norm/filter/hn_filter_gemini_text_latest
        json: prompts/gemini/hypos_norm/filter/hn_filter_gemini_json_latest
