# Конфиг сайта perplexity
# Содержит: url, home/reset, scenarios, prompts

site:
  name: perplexity
  url: https://www.perplexity.ai/

  home:
    reset:
      sequence:
        - type: hotkey
          keys: [ctrl, l]
        - type: wait
          seconds: 2.0
        - type: hotkey
          keys: [ctrl, l]
        - type: wait
          seconds: 2.0
        - type: text
          value: https://www.perplexity.ai/
        - type: key
          key: enter
        - type: wait
          seconds: 3.0

  scenarios:
    grok:
      start_state: start_question

      states:

        start_question:
          expect:
            templates:
              - templates/brave/perplexity/ask_anything.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/brave/perplexity/model.png
            threshold: 0.8
          next:
            success: open_model_menu
            fail: model_selected
          timeout: 120.0

        open_model_menu:
          expect:
            templates:
              - templates/brave/perplexity/model.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/brave/perplexity/sonar.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 120.0

        model_selected:
          expect:
            templates:
              - templates/brave/perplexity/grok_main_page.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/brave/perplexity/sonar.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 120.0

        options_menu_opened:
          expect:
            templates:
              - templates/brave/perplexity/grok.png
            threshold: 0.8
          action: click
          condition:
            templates:
              - templates/brave/perplexity/grok_selected.png
            threshold: 0.8
          next:
            success: close_options_menu
            fail: scroll_down
          timeout: 120.0

        scroll_down:
          expect:
            templates:
              - templates/brave/perplexity/sonar.png
            threshold: 0.8
          action: click_scroll_down
          condition:
            templates:
              - templates/brave/perplexity/grok.png
            threshold: 0.8
          next:
            success: options_menu_opened
            fail: start_question
          timeout: 120.0

        close_options_menu:
          expect:
            templates:
              - templates/brave/perplexity/type_for.png
            threshold: 0.9
          action: click
          condition:
            templates:
              - templates/brave/perplexity/type_for.png
            threshold: 0.9
          next:
            success: ask_empty
            fail: start_question
          timeout: 120.0

        ask_empty:
          expect:
            templates:
              - templates/brave/perplexity/type_for.png
            threshold: 0.9
          action: click_paste_enter
          condition:
            templates:
              - templates/brave/perplexity/stop.png
            threshold: 0.9
          next:
            success: answer_processing
            fail: start_question
          timeout: 120.0

        answer_processing:
          expect:
            templates:
              - templates/brave/perplexity/white_gray_arrow_up.png
            threshold: 0.9
          action: click_ctrl_end
          condition:
            templates:
              - templates/brave/perplexity/copy_rewrite.png
            threshold: 0.9
          next:
            success: end_of_answer
            fail: scroll_up
          timeout: 300.0

        scroll_up:
          expect:
            templates:
              - templates/brave/perplexity/left_bottom_corner.png
            threshold: 0.9
          action: scroll_up
          condition:
            templates:
              - templates/brave/perplexity/copy_rewrite.png
            threshold: 0.9
          next:
            success: end_of_answer
            fail: scroll_up
          timeout: 120.0

        end_of_answer:
          expect:
            templates:
              - templates/brave/perplexity/copy.png
            threshold: 0.9
          action: click_copy_save_json_check
          condition:
            json_valid: true
          next:
            success: start_question
            fail: reload_answer
          timeout: 120.0

        reload_answer:
          expect:
            templates:
              - templates/brave/perplexity/rewrite_arrows.png
            threshold: 0.9
          action: click
          condition:
            templates:
              - templates/brave/perplexity/rewrite_button.png
          next:
            success: push_rewrite
            fail: start_question
          timeout: 120.0

        push_rewrite:
          expect:
            templates:
              - templates/brave/perplexity/rewrite_button.png
            threshold: 0.9
          action: click
          condition:
            templates:
              - templates/brave/perplexity/stop.png
          next:
            success: answer_processing
            fail: start_question
          timeout: 120.0

