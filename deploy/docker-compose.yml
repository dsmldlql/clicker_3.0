version: '3.8'

# Один контейнер = один бот.
# Каждый бот читает свой config_bot.yaml и config_site_{site}.yaml.

services:
  bot_0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clicker_bot_0
    shm_size: 2gb
    ports:
      - "6970:80"            # noVNC (web browser)
      - "5970:5900"          # VNC
    environment:
      - VNC_PASSWORD=
      - RESOLUTION=1366x768
    volumes:
      - ./scripts:/home/scripts
      - ./config_bot_0.yaml:/home/config/config_bot.yaml
      - ./site_configs:/home/site_configs
      - ./profiles/bot_0:/home/profiles/bot_0
      - ./answers:/home/answers
      - ./datasets:/home/datasets
      - ./prompts:/home/prompts
      - ./templates:/home/templates
      - ./logs:/home/logs
    cap_add:
      - SYS_ADMIN

  bot_1:
